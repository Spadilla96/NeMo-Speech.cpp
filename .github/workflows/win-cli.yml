name: Windows CPU CLI

on: workflow_dispatch

jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize submodules
        run: git submodule update --init --depth 1 ggml llama.cpp

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install -y ninja --no-progress
          }

      - name: Configure and build
        shell: pwsh
        run: scripts\windows\build.ps1 -Backend cpu -Profile core -BuildDir "${{ github.workspace }}\build\win"

      - name: List outputs
        shell: pwsh
        run: Get-ChildItem build\win -Recurse -Include *.exe,*.dll | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: nemo-speech-windows-cpu
          path: |
            build/win/**/*.exe
            build/win/**/*.dll
