name: Windows Vulkan CLI

on: workflow_dispatch

jobs:
  windows-vulkan:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize submodules
        run: git submodule update --init --depth 1 ggml llama.cpp

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install -y ninja --no-progress
          }

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Portable CPU flags (no -march=native)
        shell: pwsh
        run: |
          $p = "scripts/windows/build.ps1"
          $s = Get-Content $p -Raw
          $s = $s.Replace("'-DNEMO_SPEECH_WITH_NORM=OFF',", "'-DNEMO_SPEECH_WITH_NORM=OFF', '-DGGML_NATIVE=OFF',")
          Set-Content -Path $p -Value $s
          if (-not (Select-String -Path $p -Pattern "GGML_NATIVE=OFF" -Quiet)) { throw "patch failed" }

      - name: Configure and build
        shell: pwsh
        run: scripts/windows/build.ps1 -Backend vulkan -Profile core -BuildDir "${{ github.workspace }}/build/winvk"

      - name: Verify flags
        shell: pwsh
        run: |
          $c = Get-Content build/winvk/CMakeCache.txt | Select-String "GGML_NATIVE|GGML_VULKAN"
          $c
          if (-not ($c -match "GGML_NATIVE:BOOL=OFF")) { throw "GGML_NATIVE still on" }
          if (-not ($c -match "GGML_VULKAN:BOOL=ON")) { throw "Vulkan not enabled" }

      - name: List outputs
        shell: pwsh
        run: Get-ChildItem build/winvk -Recurse -Include *.exe,*.dll | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: nemo-speech-windows-vulkan
          path: |
            build/winvk/**/*.exe
            build/winvk/**/*.dll
