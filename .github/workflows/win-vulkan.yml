name: Windows Vulkan CLI

on: workflow_dispatch

jobs:
  windows-vulkan:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize submodules
        run: git submodule update --init --depth 1 ggml llama.cpp

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install -y ninja --no-progress
          }

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Add SPIRV-Headers CMake package to the Vulkan SDK
        shell: pwsh
        run: |
          # Run outside the repo so vcpkg uses classic mode, not the manifest.
          Push-Location $env:RUNNER_TEMP
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          Pop-Location
          $root = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          $dest = Join-Path $env:VULKAN_SDK "Lib/cmake/SPIRV-Headers"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$root/share/spirv-headers/*" $dest -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:VULKAN_SDK "include/spirv") | Out-Null
          Copy-Item "$root/include/spirv/*" (Join-Path $env:VULKAN_SDK "include/spirv") -Recurse -Force
          Get-ChildItem $dest

      - name: Portable CPU flags (no -march=native)
        shell: pwsh
        run: |
          $p = "scripts/windows/build.ps1"
          $s = Get-Content $p -Raw
          $s = $s.Replace("'-DNEMO_SPEECH_WITH_NORM=OFF',", "'-DNEMO_SPEECH_WITH_NORM=OFF', '-DGGML_NATIVE=OFF',")
          Set-Content -Path $p -Value $s
          if (-not (Select-String -Path $p -Pattern "GGML_NATIVE=OFF" -Quiet)) { throw "patch failed" }

      - name: Configure and build
        shell: pwsh
        run: scripts/windows/build.ps1 -Backend vulkan -Profile core -BuildDir "${{ github.workspace }}/build/winvk"

      - name: Verify flags
        shell: pwsh
        run: |
          $c = Get-Content build/winvk/CMakeCache.txt | Select-String "GGML_NATIVE|GGML_VULKAN"
          $c
          if (-not ($c -match "GGML_NATIVE:BOOL=OFF")) { throw "GGML_NATIVE still on" }
          if (-not ($c -match "GGML_VULKAN:BOOL=ON")) { throw "Vulkan not enabled" }

      - name: List outputs
        shell: pwsh
        run: Get-ChildItem build/winvk -Recurse -Include *.exe,*.dll | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: nemo-speech-windows-vulkan
          path: |
            build/winvk/**/*.exe
            build/winvk/**/*.dll
